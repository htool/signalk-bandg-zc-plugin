<html>
<head>
  <META http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <META http-equiv="Pragma" content="no-cache" />
  <META http-equiv="Expires" content="0" />
  <META content="IE=11.0000" http-equiv="X-UA-Compatible">
  <META charset="utf-8">
  <META name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <META name="navico-store" content="mfd-insight-store">
  <title>ZC1 remote control</title>
  <script type="text/javascript" src="zc-ui.js"></script>
  <style>
    body {
      margin: 0;
      background: #000;
    }
    img {
      -drag: none;
      user-select: none;
      -moz-user-select: none;
      -webkit-user-drag: none;
      -webkit-user-select: none;
      -ms-user-select: none;
    }
    .zc-panel {
      position: relative;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }
    .zc-faceplate {
      width: 100%;
      height: auto;
      display: block;
      pointer-events: none;
    }
    .zc-well {
      position: absolute;
      overflow: hidden;
      background: #1a1a1a;
      cursor: pointer;
    }
    .zc-face {
      position: absolute;
      display: block;
      max-width: none;
      pointer-events: none;
    }
    .zc-well.is-pressed .zc-face {
      transform: translate(3px, 3px);
    }
    .zc-led {
      position: absolute;
      pointer-events: none;
      background: red;
    }
  </style>
</head>
<body>
<div id="zc-panel" class="zc-panel">
  <img class="zc-faceplate" src="control-panel.jpg" alt="B&amp;G ZC1 remote">
</div>
<script>
function getJson(url, onOk) {
  var xhr = new XMLHttpRequest()
  xhr.open('GET', url, true)
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4) {
      return
    }
    if (xhr.status < 200 || xhr.status >= 300) {
      return
    }
    var data = xhr.responseText
    try {
      data = JSON.parse(xhr.responseText)
    } catch (e) {}
    if (onOk) {
      onOk(data)
    }
  }
  xhr.send()
}

function sendKey(button, action) {
  getJson(ZcUi.keyUrl(button, action))
}

function paintLed(data) {
  var led = document.getElementById("zc-led")
  if (led) {
    led.style.background = ZcUi.ledColorFromStatus(data)
  }
}

function pollStatus() {
  getJson(ZcUi.statusUrl(), paintLed)
}

var panel = document.getElementById("zc-panel");
ZcUi.mount(panel, { imageSrc: "control-panel.jpg", send: sendKey });
pollStatus();
setInterval(pollStatus, 2000);
</script>
</body>
</html>
